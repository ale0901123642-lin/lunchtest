<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <!-- 支援手機與平板響應式顯示 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>午餐吃什麼？</title>

  <style>
    :root {
      --primary-color: #ff6b35;
      --primary-dark: #e45724;
      --header-color: #ff8c42;
      --background-color: #f7f7f7;
      --card-color: #ffffff;
      --text-color: #333333;
      --muted-color: #666666;
      --border-color: #dddddd;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text-color);
      background: var(--background-color);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* 頁首 */
    header {
      padding: 36px 20px;
      color: white;
      background: var(--header-color);
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 36px);
    }

    header p {
      margin: 0;
      font-size: clamp(15px, 2vw, 18px);
    }

    /* 主要內容 */
    .container {
      width: min(100% - 32px, 1000px);
      margin: 24px auto 40px;
    }

    /* 搜尋區塊 */
    .search-panel {
      padding: clamp(18px, 4vw, 28px);
      background: var(--card-color);
      border-radius: var(--radius);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: end;
    }

    .form-group {
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    select {
      border: 1px solid var(--border-color);
      background: white;
      cursor: pointer;
    }

    button {
      border: none;
      color: white;
      background: var(--primary-color);
      cursor: pointer;
      font-weight: bold;
      transition:
        background-color 0.2s ease,
        transform 0.15s ease;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    /* 位置資訊 */
    .location-info {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      color: #8a421e;
      background: #fff3e9;
      font-size: 15px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* 狀態文字 */
    .status {
      min-height: 24px;
      margin: 20px 0 8px;
      color: var(--primary-dark);
      text-align: center;
      font-weight: bold;
    }

    /* 搜尋結果標題 */
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 25px 0 15px;
    }

    .result-header h2 {
      margin: 0;
      font-size: clamp(22px, 4vw, 28px);
    }

    #resultCount {
      color: var(--muted-color);
      white-space: nowrap;
    }

    /* 店家列表 */
    .store-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .store-card {
      min-width: 0;
      padding: 18px;
      background: var(--card-color);
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .store-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
    }

    .store-name {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 10px;
      color: #e85b2a;
      font-size: 19px;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .store-name:hover {
      text-decoration: underline;
    }

    .store-info {
      color: var(--muted-color);
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .distance {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 9px;
      border-radius: 20px;
      color: #e85b2a;
      background: #fff0e8;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 30px 20px;
      border-radius: 12px;
      color: #777777;
      background: white;
      text-align: center;
    }

    /* 平板 */
    @media (max-width: 900px) {
      .form-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-group:last-child {
        grid-column: 1 / -1;
      }

      .store-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* 手機 */
    @media (max-width: 600px) {
      header {
        padding:
          max(28px, env(safe-area-inset-top))
          16px
          28px;
      }

      .container {
        width: min(100% - 24px, 1000px);
        margin-top: 16px;
      }

      .search-panel {
        padding: 16px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .form-group:last-child {
        grid-column: auto;
      }

      select,
      button {
        min-height: 52px;
        font-size: 16px;
      }

      .location-info {
        font-size: 14px;
      }

      .result-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      #resultCount {
        font-size: 14px;
      }

      .store-list {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .store-card {
        padding: 16px;
      }

      .store-name {
        font-size: 18px;
      }
    }

    /* 很小的手機 */
    @media (max-width: 380px) {
      header h1 {
        font-size: 25px;
      }

      .container {
        width: calc(100% - 20px);
      }

      .search-panel {
        padding: 14px;
      }

      .store-card {
        padding: 14px;
      }
    }

    /* 減少動畫 */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>午餐吃什麼？</h1>
    <p>搜尋你附近的餐飲店家</p>
  </header>

  <main class="container">
    <section class="search-panel">
      <div class="form-row">
        <!-- 搜尋距離 -->
        <div class="form-group">
          <label for="radius">搜尋範圍</label>

          <select id="radius">
            <option value="500">500 公尺內</option>
            <option value="1000" selected>1 公里內</option>
            <option value="1500">1.5 公里內</option>
          </select>
        </div>

        <!-- 店家類型 -->
        <div class="form-group">
          <label for="category">店家類型</label>

          <select id="category">
            <option value="all">全部</option>
            <option value="restaurant">餐廳</option>
            <option value="snack">小吃店</option>
            <option value="noodle">麵食館</option>
            <option value="bento">便當快餐店</option>
            <option value="hotpot">火鍋店</option>
            <option value="bbq">燒烤店</option>
            <option value="brunch">早午餐店</option>
            <option value="cafe">咖啡廳</option>
            <option value="dessert">甜點冰品店</option>
            <option value="drink">飲料店</option>
          </select>
        </div>

        <!-- 搜尋按鈕 -->
        <div class="form-group">
          <button id="searchButton">
            搜尋店家
          </button>
        </div>
      </div>

      <div id="locationInfo" class="location-info">
        正在取得目前位置……
      </div>
    </section>

    <div id="status" class="status"></div>

    <section>
      <div class="result-header">
        <h2>附近店家</h2>
        <span id="resultCount"></span>
      </div>

      <div id="storeList" class="store-list">
        <div class="empty">
          請先允許網站取得目前位置，再按下「搜尋店家」。
        </div>
      </div>
    </section>
  </main>

  <script>
    let userLocation = null;
    let allStores = [];

    const radiusSelect = document.getElementById("radius");
    const categorySelect = document.getElementById("category");
    const searchButton = document.getElementById("searchButton");
    const locationInfo = document.getElementById("locationInfo");
    const statusText = document.getElementById("status");
    const storeList = document.getElementById("storeList");
    const resultCount = document.getElementById("resultCount");

    /*
     * 網頁載入後取得使用者目前位置
     */
    window.addEventListener("load", getUserLocation);

    function getUserLocation() {
      if (!navigator.geolocation) {
        locationInfo.textContent =
          "你的瀏覽器不支援定位功能。";

        return;
      }

      locationInfo.textContent =
        "正在取得目前位置……";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          userLocation = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };

          locationInfo.innerHTML = `
            已取得目前位置：<br>
            緯度：${userLocation.latitude.toFixed(6)}<br>
            經度：${userLocation.longitude.toFixed(6)}
          `;
        },

        function (error) {
          let message = "無法取得目前位置。";

          if (error.code === error.PERMISSION_DENIED) {
            message =
              "你拒絕了定位權限，請允許網站取得位置。";
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            message =
              "目前無法取得位置資訊。";
          } else if (error.code === error.TIMEOUT) {
            message =
              "取得位置逾時，請再試一次。";
          }

          locationInfo.textContent = message;
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    /*
     * 搜尋按鈕
     */
    searchButton.addEventListener("click", async function () {
      if (!userLocation) {
        alert(
          "尚未取得目前位置，請先允許定位功能。"
        );

        getUserLocation();
        return;
      }

      const radius = Number(radiusSelect.value);

      searchButton.disabled = true;
      statusText.textContent = "正在搜尋附近店家……";
      resultCount.textContent = "";
      storeList.innerHTML = "";

      try {
        allStores = await searchNearbyStores(
          userLocation.latitude,
          userLocation.longitude,
          radius
        );

        renderStores();
        statusText.textContent = "";
      } catch (error) {
        console.error(error);

        statusText.textContent =
          "搜尋失敗，請稍後再試。";

        storeList.innerHTML = `
          <div class="empty">
            搜尋店家時發生錯誤，請稍後再試。
          </div>
        `;
      } finally {
        searchButton.disabled = false;
      }
    });

    /*
     * 使用 OpenStreetMap Overpass API
     * 搜尋附近的餐廳、速食店、咖啡廳、甜點店等
     */
    async function searchNearbyStores(
      latitude,
      longitude,
      radius
    ) {
      const query = `
        [out:json][timeout:25];

        (
          nwr["amenity"~"restaurant|fast_food|cafe|ice_cream|food_court"]
            (around:${radius},${latitude},${longitude});

          nwr["shop"~"bakery|confectionery|beverages"]
            (around:${radius},${latitude},${longitude});
        );

        out center tags;
      `;

      const response = await fetch(
        "https://overpass-api.de/api/interpreter",
        {
          method: "POST",
          body: query
        }
      );

      if (!response.ok) {
        throw new Error(
          "Overpass API request failed"
        );
      }

      const data = await response.json();

      const stores = data.elements
        .map(function (element) {
          const tags = element.tags || {};

          const storeLatitude =
            element.lat ?? element.center?.lat;

          const storeLongitude =
            element.lon ?? element.center?.lon;

          if (
            storeLatitude === undefined ||
            storeLongitude === undefined
          ) {
            return null;
          }

          const name =
            tags.name ||
            tags["name:zh"] ||
            tags["name:en"] ||
            "未命名店家";

          const address =
            tags["addr:full"] ||
            buildAddress(tags) ||
            "地址資料不完整";

          const distance = calculateDistance(
            userLocation.latitude,
            userLocation.longitude,
            storeLatitude,
            storeLongitude
          );

          return {
            id: `${element.type}-${element.id}`,
            name: name,
            address: address,
            phone: tags.phone || "",
            amenity: tags.amenity || "",
            shop: tags.shop || "",
            cuisine: tags.cuisine || "",
            latitude: storeLatitude,
            longitude: storeLongitude,
            distance: distance
          };
        })
        .filter(Boolean);

      /*
       * 由近到遠排序
       */
      stores.sort(function (a, b) {
        return a.distance - b.distance;
      });

      /*
       * 移除重複店家
       */
      return Array.from(
        new Map(
          stores.map(function (store) {
            return [store.id, store];
          })
        ).values()
      );
    }

    /*
     * 組合店家地址
     */
    function buildAddress(tags) {
      return [
        tags["addr:postcode"],
        tags["addr:city"],
        tags["addr:town"],
        tags["addr:district"],
        tags["addr:street"],
        tags["addr:housenumber"]
      ]
        .filter(Boolean)
        .join("");
    }

    /*
     * 計算兩個經緯度之間的距離
     * 回傳單位：公尺
     */
    function calculateDistance(
      lat1,
      lon1,
      lat2,
      lon2
    ) {
      const earthRadius = 6371000;

      function toRadians(degree) {
        return degree * Math.PI / 180;
      }

      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRadians(lat1)) *
          Math.cos(toRadians(lat2)) *
          Math.sin(dLon / 2) ** 2;

      const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

      return earthRadius * c;
    }

    /*
     * 判斷店家是否符合所選類型
     */
    function matchCategory(store, category) {
      if (category === "all") {
        return true;
      }

      const text = [
        store.name,
        store.cuisine,
        store.amenity,
        store.shop
      ]
        .join(" ")
        .toLowerCase();

      switch (category) {
        case "restaurant":
          return store.amenity === "restaurant";

        case "snack":
          return (
            store.amenity === "fast_food" ||
            /小吃|鹽酥雞|雞排|滷味|肉圓|臭豆腐/
              .test(text)
          );

        case "noodle":
          return /麵|拉麵|牛肉麵|麵線|米粉|河粉|烏龍|noodle/
            .test(text);

        case "bento":
          return /便當|自助餐|快餐|燒臘|bento|lunch/
            .test(text);

        case "hotpot":
          return /火鍋|鍋物|涮涮鍋|麻辣鍋|hotpot/
            .test(text);

        case "bbq":
          return /燒烤|烤肉|串燒|炭火|bbq|barbecue/
            .test(text);

        case "brunch":
          return /早午餐|早餐|brunch|breakfast/
            .test(text);

        case "cafe":
          return (
            store.amenity === "cafe" ||
            /咖啡|coffee|cafe/.test(text)
          );

        case "dessert":
          return (
            store.amenity === "ice_cream" ||
            store.shop === "confectionery" ||
            /甜點|蛋糕|冰品|冰淇淋|豆花|剉冰|dessert/
              .test(text)
          );

        case "drink":
          return (
            store.shop === "beverages" ||
            /飲料|茶飲|手搖|果汁|珍珠|drink|tea|juice/
              .test(text)
          );

        default:
          return true;
      }
    }

    /*
     * 顯示店家
     */
    function renderStores() {
      const selectedCategory =
        categorySelect.value;

      const filteredStores = allStores.filter(
        function (store) {
          return matchCategory(
            store,
            selectedCategory
          );
        }
      );

      resultCount.textContent =
        `共 ${filteredStores.length} 家`;

      if (filteredStores.length === 0) {
        storeList.innerHTML = `
          <div class="empty">
            目前搜尋範圍內找不到符合條件的店家。
          </div>
        `;

        return;
      }

      storeList.innerHTML = filteredStores
        .map(function (store) {
          const googleMapsUrl =
            createGoogleMapsUrl(store);

          return `
            <article class="store-card">
              <a
                class="store-name"
                href="${googleMapsUrl}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${escapeHtml(store.name)}
              </a>

              <div class="store-info">
                <div>
                  地址：
                  ${escapeHtml(store.address)}
                </div>

                ${
                  store.phone
                    ? `
                      <div>
                        電話：
                        ${escapeHtml(store.phone)}
                      </div>
                    `
                    : ""
                }
              </div>

              <span class="distance">
                距離約 ${formatDistance(store.distance)}
              </span>
            </article>
          `;
        })
        .join("");
    }

    /*
     * 建立 Google 地圖連結
     */
    function createGoogleMapsUrl(store) {
      const query = [
        store.name,
        store.address,
        `${store.latitude},${store.longitude}`
      ].join(", ");

      return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query)
      );
    }

    /*
     * 格式化距離
     */
    function formatDistance(distance) {
      if (distance < 1000) {
        return `${Math.round(distance)} 公尺`;
      }

      return `${(distance / 1000).toFixed(1)} 公里`;
    }

    /*
     * 避免店家資料中的 HTML 造成安全問題
     */
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /*
     * 切換店家類型時，直接重新篩選目前資料
     */
    categorySelect.addEventListener(
      "change",
      function () {
        if (allStores.length > 0) {
          renderStores();
        }
      }
    );
  </script>
</body>
</html>
